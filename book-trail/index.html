<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>책길 탐험대 - 게임으로 배우는 도서관 책 찾기</title>
  <meta name="description" content="미로, 책꽂이 정리, 외계인, 벽돌 깨기, 뱀, 두더지! 6가지 고전게임으로 도서관 청구기호(KDC)와 책 찾는 법을 재미있게 배우는 어린이용 웹 게임" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-brand" id="brandLogo">
      <div class="brand-icon-box">📚</div>
      <div class="brand-text">
        <h1>책길 탐험대</h1>
        <span>도서관 책 찾기 게임</span>
      </div>
    </div>

    <nav class="header-nav">
      <button class="nav-btn active" data-screen="start"><span>🏠</span> 처음</button>
      <button class="nav-btn" data-screen="game-select"><span>🎮</span> 게임</button>
      <button class="nav-btn" data-screen="tutorial"><span>📘</span> 배움터</button>
      <button class="nav-btn admin" data-screen="admin"><span>⚙️</span> 사서 선생님</button>
    </nav>

    <div class="header-actions">
      <button class="sound-toggle-btn" id="btnToggleSound" title="효과음 켜기/끄기">🔊</button>
      <button class="bgm-toggle-btn off" id="btnToggleBgm" title="배경음악 켜기/끄기">🎶</button>
      <div class="user-badge-btn" id="avatarBadge" title="내 캐릭터 바꾸기">
        <div class="user-avatar" id="headerAvatar">🦊</div>
        <span class="user-name" id="headerStars">⭐ 0</span>
      </div>
    </div>
  </header>

  <main class="app-container" id="mainContent"></main>

  <!-- 모바일/태블릿 하단 메뉴 -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="start"><span>🏠</span>처음</button>
    <button class="nav-btn" data-screen="game-select"><span>🎮</span>게임</button>
    <button class="nav-btn" data-screen="tutorial"><span>📘</span>배움터</button>
    <button class="nav-btn admin" data-screen="admin"><span>⚙️</span>사서</button>
  </nav>

  <div id="modalContainer"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
